<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 315" width="650" height="315" style="background:#ffffff;">
  <g font-family="Arial, sans-serif" font-size="9.5" fill="none" stroke="#78716c" stroke-width="1.3">
    <text x="215" y="16" text-anchor="middle" fill="#000" stroke="none" font-weight="bold">Десктопний монітор штабу (≥ 1024 px)</text>
    <text x="545" y="16" text-anchor="middle" fill="#000" stroke="none" font-weight="bold">Польовий смартфон (&lt; 1024 px)</text>

    <rect x="20" y="24" width="395" height="255" rx="6" fill="#f5f5f4" stroke="#44403c"/>
    <!-- Dark Top Header (1) -->
    <rect x="20" y="24" width="395" height="24" fill="#1e293b"/>
    <!-- Dark Left Nav (2) -->
    <rect x="20" y="48" width="82" height="231" fill="#334155"/>
    <!-- 4 KPI Cards at Top (3) -->
    <rect x="110" y="56" width="70" height="36" rx="3" fill="#fff"/>
    <rect x="185" y="56" width="70" height="36" rx="3" fill="#fff"/>
    <rect x="260" y="56" width="70" height="36" rx="3" fill="#fff"/>
    <rect x="335" y="56" width="72" height="36" rx="3" fill="#fff"/>
    <!-- Sector Verification Widget (4) + Mission Order (5) -->
    <rect x="110" y="98" width="190" height="52" rx="4" fill="#fff"/>
    <rect x="306" y="98" width="101" height="52" rx="4" fill="#fff"/>
    <!-- GIS Map (6) + DSS Queue & Directive (7, 8) -->
    <rect x="110" y="156" width="190" height="115" rx="4" fill="#fff"/>
    <line x1="115" y1="164" x2="295" y2="266"/>
    <line x1="295" y1="164" x2="115" y2="266"/>
    <rect x="306" y="156" width="101" height="68" rx="4" fill="#fff"/>
    <rect x="306" y="230" width="101" height="41" rx="4" fill="#fff"/>

    <!-- Mobile Wireframe -->
    <rect x="470" y="24" width="150" height="255" rx="8" fill="#f5f5f4" stroke="#44403c"/>
    <rect x="470" y="24" width="150" height="22" fill="#1e293b"/>
    <rect x="478" y="52" width="64" height="28" rx="3" fill="#fff"/>
    <rect x="548" y="52" width="64" height="28" rx="3" fill="#fff"/>
    <rect x="478" y="84" width="64" height="28" rx="3" fill="#fff"/>
    <rect x="548" y="84" width="64" height="28" rx="3" fill="#fff"/>
    <rect x="478" y="118" width="134" height="44" rx="4" fill="#fff"/>
    <rect x="478" y="168" width="134" height="80" rx="4" fill="#fff"/>
    <rect x="470" y="255" width="150" height="24" fill="#334155"/>

    <!-- Emerald Badges -->
    <g fill="#059669" stroke="none" font-weight="bold" font-size="9">
      <circle cx="215" cy="36" r="8"/><text x="215" y="39" text-anchor="middle" fill="#fff">1</text>
      <circle cx="61" cy="157" r="8"/><text x="61" y="160" text-anchor="middle" fill="#fff">2</text>
      <circle cx="255" cy="74" r="8"/><text x="255" y="77" text-anchor="middle" fill="#fff">3</text>
      <circle cx="205" cy="124" r="8"/><text x="205" y="127" text-anchor="middle" fill="#fff">4</text>
      <circle cx="356" cy="124" r="8"/><text x="356" y="127" text-anchor="middle" fill="#fff">5</text>
      <circle cx="205" cy="212" r="8"/><text x="205" y="215" text-anchor="middle" fill="#fff">6</text>
      <circle cx="356" cy="190" r="8"/><text x="356" y="193" text-anchor="middle" fill="#fff">7</text>
      <circle cx="356" cy="250" r="8"/><text x="356" y="253" text-anchor="middle" fill="#fff">8</text>
    </g>

    <text x="325" y="302" text-anchor="middle" fill="#000" stroke="none" font-weight="bold" font-size="11">Рис. 9 – Схематичний каркас екранів (Wireframe) платформи «Контур-СППР»</text>
  </g>
</svg>
