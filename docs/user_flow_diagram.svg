<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#f8fafc; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Заголовок діаграми -->
  <text x="500" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">
    ДІАГРАМА ПОТОКУ КОРИСТУВАЧА (USER FLOW DIAGRAM)
  </text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#64748b">
    Процес аналізу, пріоритизації та експорту завдань гуманітарного розмінування в СППР
  </text>

  <!-- СТАРТ -->
  <rect x="410" y="100" width="180" height="46" rx="23" fill="#0f172a" filter="url(#shadow)"/>
  <text x="500" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Вхід користувача (ОПР)</text>

  <line x1="500" y1="146" x2="500" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Крок 1: Завантаження та огляд карти -->
  <rect x="360" y="180" width="280" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">1. Огляд оперативної карти</text>
  <text x="500" y="225" text-anchor="middle" font-size="11" fill="#64748b">Відображення секторів, полігонів загроз та KPI</text>

  <line x1="500" y1="240" x2="500" y2="275" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Розгалуження: Режим роботи -->
  <polygon points="500,280 620,325 500,370 380,325" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Необхідна дія?</text>
  <text x="500" y="337" text-anchor="middle" font-size="10" fill="#475569">[Вибір функції]</text>

  <!-- Гілка вліво: Реєстрація нового сектора -->
  <line x1="380" y1="325" x2="220" y2="325" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="315" text-anchor="middle" font-size="11" fill="#475569">Додати новий сектор</text>

  <rect x="80" y="295" width="230" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="195" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Введення даних сектора</text>
  <text x="195" y="338" text-anchor="middle" font-size="11" fill="#64748b">Координати, площа, критерії c1..c5</text>

  <!-- Зворотня стрілка від додавання сектора -->
  <path d="M 195 355 L 195 400 L 420 400" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Гілка прямо (основна): Налаштування СППР -->
  <line x1="500" y1="370" x2="500" y2="405" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="560" y="390" text-anchor="start" font-size="11" font-weight="bold" fill="#2563eb">Оцінка та пріоритизація</text>

  <!-- Крок 2: Панель налаштування ваг СППР -->
  <rect x="350" y="410" width="300" height="70" rx="10" fill="url(#dssGrad)" filter="url(#shadow)"/>
  <text x="500" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2. Налаштування моделі СППР</text>
  <text x="500" y="458" text-anchor="middle" font-size="11" fill="#e9d5ff">Вибір пресету або ручні ваги: w1, w2, w3, w4, w5</text>

  <line x1="500" y1="480" x2="500" y2="510" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Крок 3: Розрахунок та ранжування черги -->
  <rect x="340" y="515" width="320" height="60" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">3. Розрахунок індексу Pi та ранжування</text>
  <text x="500" y="558" text-anchor="middle" font-size="11" fill="#64748b">WLC-алгоритм, оновлення кольорів карти та черги</text>

  <line x1="500" y1="575" x2="500" y2="605" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Крок 4: Фінальна дія (Експорт та оперативне планування) -->
  <rect x="370" y="610" width="260" height="50" rx="8" fill="url(#actionGrad)" filter="url(#shadow)"/>
  <text x="500" y="635" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4. Експорт оперативного плану</text>
  <text x="500" y="650" text-anchor="middle" font-size="11" fill="#d1fae5">Вивантаження CSV / Формування PDF звіту</text>
</svg>
