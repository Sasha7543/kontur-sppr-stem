<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 590" width="700" height="590" style="background:#ffffff;">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000"/>
    </marker>
  </defs>
  <!-- Рис. 1: Потік користувача «Активація допуску саперного екіпажу» -->
  <g transform="translate(10, 10)" fill="#fff" stroke="#000" stroke-width="1.2" font-family="Arial, sans-serif" font-size="9.5">
    <rect x="85" y="8" width="120" height="28" rx="14"/>
    <text x="145" y="26" text-anchor="middle" stroke="none" fill="#000">Початок сесії</text>
    <line x1="145" y1="36" x2="145" y2="54" marker-end="url(#a1)"/>

    <rect x="45" y="56" width="200" height="34" rx="5"/>
    <text x="145" y="71" text-anchor="middle" stroke="none" fill="#000">Отримання токена допуску</text>
    <text x="145" y="83" text-anchor="middle" stroke="none" fill="#000">екіпажу в штабі ДСНС</text>
    <line x1="145" y1="90" x2="145" y2="108" marker-end="url(#a1)"/>

    <rect x="45" y="110" width="200" height="32" rx="5"/>
    <text x="145" y="130" text-anchor="middle" stroke="none" fill="#000">Вибір «Активувати допуск»</text>
    <line x1="145" y1="142" x2="145" y2="160" marker-end="url(#a1)"/>

    <rect x="45" y="162" width="200" height="36" rx="5"/>
    <text x="145" y="177" text-anchor="middle" stroke="none" fill="#000">Введення токена, ПІБ командира,</text>
    <text x="145" y="190" text-anchor="middle" stroke="none" fill="#000">службового e-mail та пароля</text>
    <line x1="145" y1="198" x2="145" y2="218" marker-end="url(#a1)"/>

    <polygon points="145,220 225,252 145,284 65,252"/>
    <text x="145" y="249" text-anchor="middle" stroke="none" fill="#000">Валідація Zod</text>
    <text x="145" y="261" text-anchor="middle" stroke="none" fill="#000">успішна?</text>
    <text x="234" y="246" stroke="none" fill="#000" font-size="9">ні</text>
    <polyline points="225,252 290,252 290,180 247,180" fill="none" marker-end="url(#a1)"/>

    <text x="156" y="297" stroke="none" fill="#000" font-size="9">так</text>
    <line x1="145" y1="284" x2="145" y2="306" marker-end="url(#a1)"/>

    <rect x="45" y="308" width="200" height="34" rx="5"/>
    <text x="145" y="328" text-anchor="middle" stroke="none" fill="#000">Верифікація токена сервером</text>
    <line x1="145" y1="342" x2="145" y2="362" marker-end="url(#a1)"/>

    <polygon points="145,364 225,396 145,428 65,396"/>
    <text x="145" y="393" text-anchor="middle" stroke="none" fill="#000">Токен активний</text>
    <text x="145" y="405" text-anchor="middle" stroke="none" fill="#000">і вільний?</text>
    <text x="234" y="390" stroke="none" fill="#000" font-size="9">ні</text>
    <polyline points="225,396 290,396 290,252" fill="none"/>

    <text x="156" y="441" stroke="none" fill="#000" font-size="9">так</text>
    <line x1="145" y1="428" x2="145" y2="450" marker-end="url(#a1)"/>

    <rect x="45" y="452" width="200" height="36" rx="5"/>
    <text x="145" y="468" text-anchor="middle" stroke="none" fill="#000">Прив’язка сектора ІРГ та вхід</text>
    <text x="145" y="480" text-anchor="middle" stroke="none" fill="#000">до «Оперативної панелі»</text>
    <line x1="145" y1="488" x2="145" y2="510" marker-end="url(#a1)"/>

    <rect x="85" y="512" width="120" height="28" rx="14"/>
    <text x="145" y="530" text-anchor="middle" stroke="none" fill="#000">Завершення</text>
    <text x="155" y="562" text-anchor="middle" stroke="none" fill="#000" font-weight="bold" font-size="11">Рис. 1 – Активація допуску саперного екіпажу</text>
  </g>

  <!-- Рис. 2: Потік користувача «Оцінка сектора в модулі СППР» -->
  <g transform="translate(350, 10)" fill="#fff" stroke="#000" stroke-width="1.2" font-family="Arial, sans-serif" font-size="9.5">
    <rect x="70" y="8" width="120" height="28" rx="14"/>
    <text x="130" y="26" text-anchor="middle" stroke="none" fill="#000">Початок</text>
    <line x1="130" y1="36" x2="130" y2="54" marker-end="url(#a1)"/>

    <rect x="35" y="56" width="190" height="34" rx="5"/>
    <text x="130" y="77" text-anchor="middle" stroke="none" fill="#000">Перехід у «Модуль СППР (Ваги)»</text>
    <line x1="130" y1="90" x2="130" y2="108" marker-end="url(#a1)"/>

    <rect x="35" y="110" width="190" height="32" rx="5"/>
    <text x="130" y="130" text-anchor="middle" stroke="none" fill="#000">Клік «+ Зареєструвати сектор»</text>
    <line x1="130" y1="142" x2="130" y2="160" marker-end="url(#a1)"/>

    <rect x="35" y="162" width="190" height="38" rx="5"/>
    <text x="130" y="177" text-anchor="middle" stroke="none" fill="#000">Введення шифру, координат,</text>
    <text x="130" y="190" text-anchor="middle" stroke="none" fill="#000">оцінок k₁..k₅ і граничного порога</text>
    <line x1="130" y1="200" x2="130" y2="220" marker-end="url(#a1)"/>

    <polygon points="130,222 205,254 130,286 55,254"/>
    <text x="130" y="251" text-anchor="middle" stroke="none" fill="#000">Параметри</text>
    <text x="130" y="263" text-anchor="middle" stroke="none" fill="#000">валідні?</text>
    <text x="212" y="248" stroke="none" fill="#000" font-size="9">ні</text>
    <polyline points="205,254 255,254 255,180 227,180" fill="none" marker-end="url(#a1)"/>

    <text x="140" y="299" stroke="none" fill="#000" font-size="9">так</text>
    <line x1="130" y1="286" x2="130" y2="308" marker-end="url(#a1)"/>

    <rect x="35" y="310" width="190" height="36" rx="5"/>
    <text x="130" y="325" text-anchor="middle" stroke="none" fill="#000">Розрахунок індексу ризику Rᵢ</text>
    <text x="130" y="338" text-anchor="middle" stroke="none" fill="#000">та пересортування черги СППР</text>
    <line x1="130" y1="346" x2="130" y2="366" marker-end="url(#a1)"/>

    <polygon points="130,368 205,402 130,436 55,402"/>
    <text x="130" y="399" text-anchor="middle" stroke="none" fill="#000">Індекс Rᵢ ≥</text>
    <text x="130" y="411" text-anchor="middle" stroke="none" fill="#000">порога загрози?</text>

    <text x="210" y="396" stroke="none" fill="#000" font-size="9">так</text>
    <line x1="205" y1="402" x2="232" y2="402" marker-end="url(#a1)"/>

    <rect x="234" y="382" width="102" height="40" rx="5"/>
    <text x="285" y="399" text-anchor="middle" stroke="none" fill="#000">Генерація тривоги</text>
    <text x="285" y="412" text-anchor="middle" stroke="none" fill="#000">«Перевищено!»</text>
    <polyline points="285,422 285,526 192,526" fill="none" marker-end="url(#a1)"/>

    <text x="140" y="452" stroke="none" fill="#000" font-size="9">ні</text>
    <line x1="130" y1="436" x2="130" y2="510" marker-end="url(#a1)"/>

    <rect x="70" y="512" width="120" height="28" rx="14"/>
    <text x="130" y="530" text-anchor="middle" stroke="none" fill="#000">Завершення</text>
    <text x="165" y="562" text-anchor="middle" stroke="none" fill="#000" font-weight="bold" font-size="11">Рис. 2 – Оцінка сектора в модулі СППР</text>
  </g>
</svg>
