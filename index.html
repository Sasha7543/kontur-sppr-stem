    function cleanHtmlContent(raw) {
      if (!raw) return '';
      const re = new RegExp('<' + 'script\\b[^<]*(?:(?!<\\/' + 'script>)<[^<]*)*<\\/' + 'script>', 'gi');
      return raw.replace(re, '').replace(/on\w+\s*=\s*["'][^"']*["']/gi, '');
    }

    function safeCsvValue(v) {
      const s = String(v ?? '');
      return /^[=+\-@]/.test(s) ? "'" + s : s;
    }

      // Розрахунок інтегрального індексу ризику СППР за методом TOPSIS / WLC
      const evaluatedZones = useMemo(() => {
        const totalW = criteriaWeights.infra + criteriaWeights.pop + criteriaWeights.agro + criteriaWeights.mine + criteriaWeights.inc || 100;
        return zones.map(z => {
          const rawScore = (
            (criteriaWeights.infra / totalW) * (z.k1_infra / 10) +
            (criteriaWeights.pop / totalW) * (z.k2_pop / 10) +
            (criteriaWeights.agro / totalW) * (z.k3_agro / 10) +
            (criteriaWeights.mine / totalW) * (z.k4_mine / 10) +
            (criteriaWeights.inc / totalW) * (z.k5_inc / 10)
          ) * 100;
          const indexVal = Math.round(rawScore * 10) / 10;
          const ratioPct = Math.round((indexVal / z.riskLimit) * 100);
          const isCritical = z.monitored && (indexVal >= z.riskLimit);
          return { ...z, indexVal, ratioPct, isCritical };
        }).sort((a, b) => b.indexVal - a.indexVal);
      }, [zones, criteriaWeights]);

      // Карта Leaflet (працює і на dashboard, і на missions)
      const leafletRef = useRef(null);

        if (screen !== 'workspace') return;
        const mapId = section === 'missions' ? 'missions-map' : section === 'dashboard' ? 'overview-map' : null;
        if (!mapId) return;
        const box = document.getElementById(mapId);
        if (!box) return;

        if (leafletRef.current) {
          leafletRef.current.remove();
          leafletRef.current = null;
        }

        const map = L.map(box, { center: [49.2, 33.4], zoom: 6 });

          attribution: 'Esri GIS | Контур-СППР'

          attribution: 'Esri Satellite | Контур-СППР'
        });

          poly.on('click', () => setSelectedZoneOnMap(z));

          const marker = L.circleMarker(z.coords, { radius: 6, color: '#fff', weight: 2, fillColor: stroke, fillOpacity: 1 }).addTo(map);
          marker.on('click', () => setSelectedZoneOnMap(z));
        });

        leafletRef.current = map;
        return () => {
          if (leafletRef.current) {
            leafletRef.current.remove();
            leafletRef.current = null;
          }

        const cols = ['Дата зміни', 'Механізоване очищення (га)', 'Ручне розмінування (га)', 'Знешкоджено ВНП (од.)', 'Усього за добу (га)', 'Витрати ПММ (тис. грн)'];

          safeCsvValue(r.day),
          String(r.machineHa.toFixed(2)).replace('.', ','),
          String(r.sapperHa.toFixed(2)).replace('.', ','),
          r.vnpCount,
          String(r.totalHa.toFixed(2)).replace('.', ','),
          String(r.costK.toFixed(2)).replace('.', ',')
        ]);
        const csvText = '\uFEFF' + [cols.join(';'), ...lines.map(l => l.join(';'))].join('\n');
        const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'reestr_rozminuvannya_kontur_sppr.csv';

        const f = e.target;
        const code = f.zCode.value.trim() || 'ХК-22';
        const name = f.zName.value.trim();
        const oblast = f.zOblast.value;
        const category = f.zCategory.value;
        const areaHa = parseFloat(f.zArea.value) || 35.0;
        const riskLimit = parseInt(f.zLimit.value, 10) || 75;
        const k1_infra = parseInt(f.k1.value, 10) || 8;
        const k2_pop = parseInt(f.k2.value, 10) || 8;
        const k3_agro = parseInt(f.k3.value, 10) || 7;
        const k4_mine = parseInt(f.k4.value, 10) || 9;
        const k5_inc = parseInt(f.k5.value, 10) || 7;
        const monitored = f.zMonitored.checked;

        if (editingZone.id) {
          setZones(prev => prev.map(item => item.id === editingZone.id ? {
            ...item, code, name, oblast, category, areaHa, riskLimit, k1_infra, k2_pop, k3_agro, k4_mine, k5_inc, monitored
          } : item));

        } else {
          const lat = 49.1 + Math.random() * 1.5;
          const lng = 33.5 + Math.random() * 2.5;
          const newObj = {
            id: 'z-' + Date.now(),
            code, name, oblast, category, areaHa, clearedHa: 0,
